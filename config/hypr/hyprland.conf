#EXECUTA NO INICIO
exec-once=/usr/lib/polkit-kde-authentication-agent-1 & waybar & wpaperd -d & swaync & wl-paste --type text --watch cliphist store & wl-paste --type image --watch cliphist store
exec-once=sleep 20 ; mpd-mpris & sleep 20 ; player=$(playerctl --list-all | grep mpd) ; sed -i "s|^player=.*|player=\"$player\"|" "$HOME/.config/dotConfig/scripts/musica"
exec-once=hyprctl setcursor Manopla 24 & hyprsunset 
exec-once=mpc repeat on && mpc random on && mpc consume on
exec-once=cp /home/gabriel/Imagens/Wallpapers/ARCH7.jpg /tmp/fundo.png ; hyprlock

#SCRIPTS
$menu = /bin/menus

#PADRÕES
$terminal = kitty
$explorer = Thunar
$browser = zen-browser

source=~/.config/hypr/rules.conf
source=~/.config/hypr/style.conf
source=~/.config/hypr/binds.conf
source=~/.config/hypr/input.conf
source=~/.config/hypr/display.conf
misc {
    enable_anr_dialog = false
}
xwayland {
    force_zero_scaling = true
}
